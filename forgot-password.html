<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NextRep | Reset Password</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body class="auth-page">
  <div class="moving-bg"></div>
  <div class="bg-particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="auth-card glass">
    <div class="auth-top">
      <h1 class="brand">NextRep</h1>
      <button id="themeToggle" class="theme-btn" type="button">🌙 Theme</button>
    </div>

    <div class="auth-view active">
      <h2>Forgot Password</h2>
      <p class="muted">Reset your password using your username.</p>

      <div class="auth-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="resetUsername" class="form-input" required />
        </div>

        <div class="form-group">
          <label>New Password</label>
          <div class="password-field">
            <input type="password" id="newPassword" class="form-input" required />
            <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">👁</button>
          </div>
        </div>

        <button type="button" class="primary-btn" onclick="resetPassword()">Reset Password</button>

        <p id="resetMessage" class="auth-message"></p>

        <p class="switch-text">
          Back to
          <a href="login.html" class="text-btn">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
