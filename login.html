<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NextRep | Smart Habit & Fitness Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body class="auth-page">
  <div class="moving-bg"></div>

  <div class="bg-particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="auth-card glass">

    <div class="auth-top">
      <h1 class="brand">NextRep</h1>
      <button id="themeToggle" class="theme-btn" type="button">🌙 Theme</button>
    </div>

    <!-- LOGIN -->
    <div id="loginView" class="auth-view active">
      <h2>Login</h2>
      <p class="muted">Welcome back.</p>

      <form id="loginForm" class="auth-form">

        <div class="form-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" class="form-input" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>

          <div class="password-field">
            <input type="password" id="loginPassword" class="form-input" required />
            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">👁</button>
          </div>
        </div>

        <p class="auth-link">
          <a href="forgot-password.html">Forgot Password?</a>
        </p>

        <button type="submit" class="primary-btn">Login</button>

        <p class="switch-text">
          New user?
          <button type="button" class="text-btn" onclick="switchToSignup()">Sign Up</button>
        </p>

      </form>
    </div>

    <!-- SIGNUP -->
    <div id="signupView" class="auth-view">
      <h2>Sign Up</h2>
      <p class="muted">Create your NextRep account.</p>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="signupFullName">Full Name</label>
          <input type="text" id="signupFullName" class="form-input" required />
        </div>

        <div class="form-group">
          <label for="signupUsername">Username</label>
          <input type="text" id="signupUsername" class="form-input" required />
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="password-field">
            <input type="password" id="signupPassword" class="form-input" required />
            <button type="button" class="toggle-password" onclick="togglePassword('signupPassword')">👁</button>
          </div>
        </div>

        <button type="submit" class="primary-btn">Create Account</button>

        <p class="switch-text">
          Already have an account?
          <button type="button" class="text-btn" onclick="switchToLogin()">Login</button>
        </p>
      </form>
    </div>

    <p class="auth-footer">© 2026 NextRep. All rights reserved.</p>
  </div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
