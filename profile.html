<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextRep | Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="profile">

  <header class="navbar glass-nav">
    <div class="nav-left">
      <h1 class="brand">NextRep</h1>
    </div>

    <nav class="nav-links">
      <a href="dashboard.html" class="nav-btn">Dashboard</a>
      <a href="profile.html" class="nav-btn active">Profile</a>
      <a href="habits.html" class="nav-btn">Habits</a>
      <a href="create-habit.html" class="nav-btn">Create Habit</a>
      <a href="fitness.html" class="nav-btn">Fitness Mode</a>
      <button id="themeToggle" class="theme-btn" type="button">🌙 Theme</button>
      <button class="logout-btn" type="button" onclick="logout()">Logout</button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="glass profile-hero-card">
      <div class="profile-hero-left">
        <div class="profile-avatar" id="profileAvatar">N</div>
        <div>
          <h2 id="profileName">NextRep User</h2>
          <p id="profileUsername">@nextrepuser</p>
        </div>
      </div>
    </section>

    <section class="glass profile-info-card">
      <div class="section-title-wrap">
        <h2>Profile Settings</h2>
        <p class="muted">Update your account details here.</p>
      </div>

      <form id="profileForm" class="profile-form-grid">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="Enter full name" />
        </div>

        <div class="form-group">
          <label for="profileUsernameInput">Username</label>
          <input type="text" id="profileUsernameInput" class="form-input" placeholder="Enter username" />
        </div>

        <div class="form-group profile-form-submit">
          <button type="submit" class="primary-btn">Save Profile</button>
        </div>

        <p id="profileMessage" class="auth-message"></p>
      </form>
    </section>

    <section class="glass profile-summary-card">
      <div class="section-title-wrap">
        <h2>Account Summary</h2>
      </div>

      <div class="profile-summary-grid">
        <div class="summary-box">
          <span>Full Name</span>
          <strong id="profileFullName">NextRep User</strong>
        </div>

        <div class="summary-box">
          <span>Username</span>
          <strong id="profileUserNameText">nextrepuser</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
